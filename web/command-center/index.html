<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backfire Command Center</title>
  <link rel="icon" type="image/png" href="assets/backfire-favicon.png">
  <script>
    // Always load the newest files: fixes land all night, and a cached copy on the demo laptop would hide them.
    window.__v = Date.now();
    document.write('<link rel="stylesheet" href="styles.css?v=' + window.__v + '">');
    // Capital One co-brand for the Nessie track: ?brand=capitalone (navy instead of T-Mobile magenta)
    if (/[?&]brand=(capitalone|c1)(&|$)/i.test(location.search)) document.documentElement.classList.add('brand-c1');
    // Light look (after a Dribbble sales dashboard) is the default; ?look=dark brings back the original magenta on dark.
    if (!/[?&]look=dark\b/.test(location.search)) {
      document.documentElement.classList.add('look-analytics');
      document.write('<link rel="stylesheet" href="look-analytics.css?v=' + window.__v + '">');
    }
  </script>
  <noscript><link rel="stylesheet" href="styles.css"></noscript>
</head>
<body>
  <div class="app" data-view="story">
    <header class="top">
      <div class="brand">
        <img class="logo-flame" src="assets/backfire-flame.png" alt="">
        <img class="logo-word" src="assets/backfire-wordmark.png" alt="Backfire">
        <span class="cobrand cobrand-tm"><span class="x" aria-hidden="true">×</span><b title="T-Mobile"><i>T</i>Mobile</b></span>
        <span class="cobrand cobrand-c1"><span class="x" aria-hidden="true">×</span><b>Capital One</b></span>
        <span class="title" id="brand-title">Command center</span>
      </div>
      <nav class="views" role="tablist" aria-label="View">
        <button role="tab" data-view="call" title="The live call (key 1)">Live call</button>
        <button role="tab" data-view="money" title="The ending: the scammer's money, stopped and flagged (key 2)">Money trail</button>
      </nav>
      <div class="top-right">
        <button id="follow" class="follow" hidden>Pinned · back to live</button>
        <span id="mode-badge" class="mode-badge" hidden></span>
      </div>
    </header>

    <section class="hero" id="hero" aria-live="polite">
      <div class="hero-main">
        <h1 id="headline" class="headline">Waiting for a call</h1>
        <p id="subline" class="subline"></p>
        <div id="rail" class="rail" role="group" aria-label="Progress: click a step to show that part"></div>
      </div>
    </section>

    <!-- app.js moves the panels for the current view into this grid -->
    <main id="grid" class="grid"></main>

    <footer class="foot">
      <div class="timeline">
        <button id="tl-play" class="tl-btn" title="Pause / play (Space)" aria-label="Pause or play"></button>
        <button id="tl-restart" class="tl-btn" title="Restart (R)" aria-label="Restart">&#8634;</button>
        <div id="tl-bar" class="tl-bar"><div id="tl-ticks" class="tl-ticks"></div><div id="tl-fill" class="tl-fill"></div></div>
        <span id="tl-text" class="tl-text"></span>
      </div>
    </footer>
  </div>

  <!-- Every panel lives here until the current view places it in the grid -->
  <div id="parking" hidden>
    <section class="panel" id="p-risk">
      <h2><span>Risk</span><small id="risk-meta">scores the caller's words only</small></h2>
      <div class="body"></div>
    </section>
    <section class="panel" id="p-feed">
      <h2><span>Call · caller side only</span><small id="feed-meta"></small></h2>
      <div class="body"></div>
    </section>
    <section class="panel" id="p-map">
      <h2><span>Where his money goes</span><small id="map-meta">Capital One Nessie sandbox · mock bank data</small></h2>
      <div class="body"></div>
    </section>
    <section class="panel" id="p-payoff">
      <div class="body"></div>
    </section>
  </div>

  <script>
    document.write('<script src="fixture.js?v=' + window.__v + '"><\/script>');
    document.write('<script src="app.js?v=' + window.__v + '"><\/script>');
  </script>
</body>
</html>
